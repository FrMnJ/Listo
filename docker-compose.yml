services:
  authentication_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: listo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authentication_db  
    ports:
      - "5432:5432"
    volumes:
      - authentication-db:/var/lib/postgresql/data
  authentication-service: 
    build: ./authentication
    volumes:
      - ./authentication:/app
    depends_on:
      - authentication_db
    ports:
      - "8000:8000"
volumes: 
  authentication-db: