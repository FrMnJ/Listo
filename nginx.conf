events {
    worker_connections 1024;
}

http {
    upstream authorization_service {
        server authorization-service:8000;
    }

    upstream authentication_service {
        server authentication-service:8000;
    }

    upstream cars_service {
        server cars-service:8000;
    }

    server {
        listen 80;
        server_name localhost;  # Replace with your domain or use localhost

        location /authorization/ {
            proxy_pass http://authorization_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /authentication/ {
            proxy_pass http://authentication_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /cars/ {
            proxy_pass http://cars_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
