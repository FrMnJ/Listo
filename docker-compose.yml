services:
  auth_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: listo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db  
    ports:
      - "5432:5432"
    volumes:
      - auth-db:/var/lib/postgresql/data
  auth-service: 
    build: ./auth
    volumes:
      - ./auth:/app
    depends_on:
      - auth_db
    ports:
      - "8000:8000"
volumes: 
  auth-db: